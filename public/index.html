<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sockert.io Hola</title>
    <link rel="stylesheet" href="https://matcha.mizu.sh/matcha.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div id="app">
        <h1>Sockert.io Hola [{{ clientId }}]</h1>
        
        <p v-if="loading">Loading...</p>
        <p v-else-if="error">{{ error }}</p>

        <ul>
            <li><button type="button" class="default" @click="getData">/api/get-data (HTTP Manual)</button></li>
            <li>
                <label>
                    <input type="text" v-model="inputData" @keyup.enter="postData" />
                    <button type="button" class="variant" @click="postData">POST via WebSocket</button>
                </label>
            </li>
            <li><a href="index.html" target="_blank">Abrir otra pestaña idéntica</a></li>
        </ul>

        <pre>{{ data }}</pre>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        const app = createApp({
            setup() {
                const inputData = ref('');
                const clientId = ref(null);
                const data = ref({});
                const serverFeedback = ref(null);
                const loading = ref(false);
                const error = ref(null);
                let socket = null;

                // Inicializar la conexión WebSocket nativa
                function initSocketIO() {
                    // io() se conecta automáticamente al host que sirve la página
                    socket = io();

                    // Escuchamos el estado inicial cuando nos conectamos
                    socket.on('init-state', (response) => {
                        console.log("Inicializado:", response);
                        clientId.value = response.id;
                        data.value = response;
                        inputData.value = response.data;
                    });

                    // Escuchamos el broadcast global cuando alguien cambia la data
                    socket.on('state-changed', (newState) => {
                        console.log("El estado cambió globalmente:", newState);
                        data.value = newState;
                        inputData.value = newState.data;
                    });

                    // Escuchamos el mensaje exclusivo uno-a-uno
                    socket.on('feedback', (msg) => {
                        serverFeedback.value = msg;
                    });

                    // Socket.io maneja la reconexión por nosotros, pero podemos enterarnos si se cae
                    socket.on('disconnect', () => {
                        console.log("Perdimos conexión con el servidor");
                    });
                }

                // Tu función original modificada para enviar vía Socket en vez de fetch
                async function postData() {
                    if (!socket || !socket.connected) {
                        error.value = "El socket no está conectado";
                        return;
                    }

                    // En lugar de enviar un JSON de texto plano con una acción adentro,
                    // disparamos un evento con nombre propio y el objeto directamente.
                    socket.emit('post-data', { data: inputData.value });
                }

                // Mantenemos tu GET original por si quieres verificar manualmente el HTTP
                async function getData() {
                    loading.value = true;
                    try {
                        const response = await fetch('/api/get-data');
                        if (!response.ok) throw new Error('Error doing GET data');
                        data.value = await response.json();
                        inputData.value = data.value.data;
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        loading.value = false;
                    }
                }

                onMounted(() => {
                    initSocketIO();
                });

                return {
                    loading,
                    inputData,
                    clientId,
                    data,
                    serverFeedback,
                    error,
                    getData,
                    postData,
                }
            }
        });

        app.mount('#app');
    </script>
</body>

</html>
