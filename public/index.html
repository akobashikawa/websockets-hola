<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway + REST API</title>
    <link rel="stylesheet" href="https://matcha.mizu.sh/matcha.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div id="app">
        <h1>Gateway + REST API [{{ clientId }}]</h1>
        
        <p v-if="loading">Loading...</p>
        <p v-else-if="error">{{ error }}</p>

        <ul>
            <li><button type="button" class="default" @click="getData">/api/get-data (HTTP Manual)</button></li>
            <li>
                <label>
                    <input type="text" v-model="inputData" @keyup.enter="postData" />
                    <button type="button" class="variant" @click="postData">POST via REST API</button>
                </label>
            </li>
            <li><a href="index.html" target="_blank">Abrir otra pestaña idéntica</a></li>
        </ul>

        <pre>{{ data }}</pre>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        const app = createApp({
            setup() {
                const inputData = ref('');
                const clientId = ref(null);
                const data = ref({});
                const loading = ref(false);
                const error = ref(null);
                const API_URL = 'http://localhost:3001';
                let socket = null;

                // Inicializar la conexión WebSocket nativa
                function initSocketIO() {
                    // Conectamos explícitamente al Gateway (puerto 3000)
                    socket = io('http://localhost:3000');

                    // Escuchamos el estado inicial cuando nos conectamos
                    socket.on('init-state', (response) => {
                        console.log("Inicializado:", response);
                        clientId.value = response.id;
                        data.value = response;
                        inputData.value = response.data;
                    });

                    // Escuchamos el broadcast global cuando alguien cambia la data
                    socket.on('state-changed', (newState) => {
                        console.log("El estado cambió globalmente:", newState);
                        data.value = newState;
                        inputData.value = newState.data;
                    });

                    // Socket.io maneja la reconexión por nosotros, pero podemos enterarnos si se cae
                    socket.on('disconnect', () => {
                        console.log("Perdimos conexión con el servidor");
                    });
                }

                // POST vía REST API (no WebSocket)
                async function postData() {
                    try {
                        const response = await fetch(`${API_URL}/api/post-data`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ data: inputData.value }),
                        });
                        if (!response.ok) throw new Error('Error en POST');
                        // El broadcast llegará vía Socket.io (Redis → Gateway → clientes)
                    } catch (err) {
                        error.value = err.message;
                    }
                }

                // GET vía REST API
                async function getData() {
                    loading.value = true;
                    try {
                        const response = await fetch(`${API_URL}/api/get-data`);
                        if (!response.ok) throw new Error('Error doing GET data');
                        data.value = await response.json();
                        inputData.value = data.value.data;
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        loading.value = false;
                    }
                }

                onMounted(() => {
                    initSocketIO();
                });

                return {
                    loading,
                    inputData,
                    clientId,
                    data,
                    error,
                    getData,
                    postData,
                }
            }
        });

        app.mount('#app');
    </script>
</body>

</html>
