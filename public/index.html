<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websockets Nativos Hola</title>
    <link rel="stylesheet" href="https://matcha.mizu.sh/matcha.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <h1>Websockets Nativo Hola</h1>
        
        <p v-if="loading">Loading...</p>
        <p v-else-if="error">{{ error }}</p>

        <ul>
            <li><button type="button" class="default" @click="getData">/api/get-data (HTTP Manual)</button></li>
            <li>
                <label>
                    <input type="text" v-model="inputData" @keyup.enter="postData" />
                    <button type="button" class="variant" @click="postData">Enviar por WebSocket</button>
                </label>
            </li>
            <li><a href="index.html" target="_blank">Abrir otra pestaña idéntica</a></li>
        </ul>

        <pre>{{ data }}</pre>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        const app = createApp({
            setup() {
                const inputData = ref('');
                const data = ref({});
                const loading = ref(false);
                const error = ref(null);
                let socket = null;

                // Inicializar la conexión WebSocket nativa
                function initWebSocket() {
                    // Usamos la API nativa del navegador: WebSocket
                    // 'ws://' es el protocolo para conexiones no cifradas (equivalente a http)
                    socket = new WebSocket(`ws://${window.location.host}`);

                    // Escuchamos cuando el backend nos mande datos
                    socket.onmessage = (event) => {
                        const response = JSON.parse(event.data);
                        data.value = response;
                        inputData.value = response.data;
                    };

                    socket.onerror = (err) => {
                        error.value = "Error en la conexión WebSocket";
                    };

                    socket.onclose = () => {
                        console.log("WebSocket cerrado. Intentando reconectar...");
                        setTimeout(initWebSocket, 2000); // Intento de reconexión básico
                    };
                }

                // Tu función original modificada para enviar vía Socket en vez de fetch
                async function postData() {
                    if (!socket || socket.readyState !== WebSocket.OPEN) {
                        error.value = "El socket no está listo";
                        return;
                    }

                    const payload = {
                        action: 'post-data',
                        data: inputData.value
                    };

                    // Enviamos los datos directamente como texto plano (JSON string)
                    socket.send(JSON.stringify(payload));
                }

                // Mantenemos tu GET original por si quieres verificar manualmente el HTTP
                async function getData() {
                    loading.value = true;
                    try {
                        const response = await fetch('/api/get-data');
                        if (!response.ok) throw new Error('Error doing GET data');
                        data.value = await response.json();
                        inputData.value = data.value.data;
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        loading.value = false;
                    }
                }

                onMounted(() => {
                    initWebSocket();
                });

                return {
                    loading,
                    inputData,
                    data,
                    error,
                    getData,
                    postData,
                }
            }
        });

        app.mount('#app');
    </script>
</body>

</html>
